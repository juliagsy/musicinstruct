[project]
name = "musicinstruct"
version = "0.1.0"
description = "MIDI-Instruct / MIDI-Reason: MIDI + instruction → MIDI with dual edit/preserve metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pretty_midi>=0.2.10",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
stress = ["datasets>=2.14"]
llm = ["transformers>=4.44", "torch", "accelerate", "huggingface_hub"]

[project.scripts]
musicinstruct = "musicinstruct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicinstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
